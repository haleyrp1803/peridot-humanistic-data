<style id="peridot-preboot-style">
  /* The pre-React shell displays an exact still from the approved Forest Study
     Canvas renderer. Its data URI is deliberately self-contained so the
     artwork can appear before Vite/React or any externally loaded asset. */
  #peridot-preboot {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    background: #253a30;
    color: #e0cdaa;
    font: 700 .76rem system-ui, sans-serif;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  #peridot-preboot img {
    display: block;
    width: min(380px, 74vw, 42vh);
    height: auto;
    aspect-ratio: 1;
    flex: none;
  }
  /* Keep the static first frame above React until the worker has drawn. */
  #peridot-preboot { opacity: 1; pointer-events: none; }
  #peridot-preboot.peridot-preboot-releasing { opacity: 0; transition: opacity 120ms linear; }
  @media (prefers-reduced-motion: reduce) {
    #peridot-preboot.peridot-preboot-releasing { transition-duration: 0ms; }
  }
</style>

    <script>
      /*
       * Preboot is intentionally outside #root: React cannot delete it before
       * the OffscreenCanvas worker produces its first real frame.
       * For fast boots that skip Suspense, release when the real app is mounted.
       */
      (() => {
        const preboot = document.getElementById('peridot-preboot');
        const root = document.getElementById('root');
        let released = false;
        let observer;
        let cleanupTimer;
        const release = () => {
          if (released || !preboot) return;
          released = true;
          observer?.disconnect();
          window.removeEventListener('peridot:loader-first-frame', release);
          preboot.classList.add('peridot-preboot-releasing');
          const cleanup = () => { window.clearTimeout(cleanupTimer); preboot.remove(); };
          preboot.addEventListener('transitionend', cleanup, { once: true });
          cleanupTimer = window.setTimeout(cleanup, 350);
        };
        window.addEventListener('peridot:loader-first-frame', release);
        observer = new MutationObserver(() => {
          // If App arrives without a Suspense loader, still clear the preboot.
          if (root.firstElementChild && !root.querySelector('.peridot-boot-loader')) {
            window.requestAnimationFrame(() => window.requestAnimationFrame(release));
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
